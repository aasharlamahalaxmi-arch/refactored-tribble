<!DOCTYPE html>
<html>
    <head>
        <title>Forms</title>
    </head>
    <body>
        <h1>College Registration Form 🏛️📝</h1>
        <forms>
            <h3>I. Student information 🎓</h3>
            <label> Full Name:</label>
            <input type="text">
            <br><br>
            <label>Date of Birth 📅:(DD/MM/YYYY)</label>
            <input type="text">
            <br><br>
            <label>Gender:</label>
            <input type="radio" name="gender">
            Male
            <input type="radio" name="gender">
            Female
            <input type="radio" name="gender">
            Other
            <br><br>
            <label>Mobile Number ☎:</label>
            <input type="number">
            <br><br>
            <label> Email ✉:</label>
            <input type="text">
            <br><br>
            <label> Permanent Address:</label>
            <input type="text">
            <h3>II.Course Selection</h3>
            <label>Course:</label>
            <input type="text">
            <br><br>
            <label>Department:</label>
                <select>
                    <option>CSE</option>
                    <option>ECE</option>
                    <option>Mechanical</option>
                    <option>Civil</option>
                    <option>EEE</option>
                </select>
            <br><br>
            <label>Academic Year:</label>
            <input type="text">
            <h3>III. Academic Details</h3>
            <label>Intermediate marks 💯</label>
            <input type="number">
            <br><br>
            <label>Intermediate percentage %</label>
            <input type="number">
            <br><br>
            <label>Entrance exam rank</label>
            <input type="number">
            <br><br>
            <label>Any queries:</label>
            <textarea rows="5" cols="20"></textarea>
            <button>Submit ✅</button>
        </forms>
    </body>
</html>
